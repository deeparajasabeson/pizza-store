name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the order number if relevant. Never include card details, passwords, or full addresses.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Menu / pizza builder
        - Cart / checkout / pricing
        - Order tracking
        - AI support chat
        - Account / sign-in
        - Admin / store staff
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. local dev, staging; browser and version"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
