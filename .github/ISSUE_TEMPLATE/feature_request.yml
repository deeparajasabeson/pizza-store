name: Feature request
description: Suggest a new capability or change
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Areas affected
      options:
        - label: Backend (API / Application / Domain)
        - label: Database (new tables or migrations)
        - label: Frontend (web)
        - label: AI support chat
        - label: Pricing / deals / tax
  - type: textarea
    id: notes
    attributes:
      label: Additional context
